<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WWCG</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    /*
      このアプリは縦持ち専用。横向きになったら覆って案内する。

      **画面の向きは固定できない。** screen.orientation.lock() は
      iOS Safari が未対応で、Android も全画面のときしか効かない。
      固定できない以上、崩れた画面を見せるより覆うほうがよい。

      Unity 側ではなく HTML でやるのは、**起動前のロード中もカバーできる**ため。
    */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b1114;
      color: #d4dbdd;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      text-align: center;
      gap: 24px;
    }
    #rotate-overlay.visible {
      display: flex;
    }
    #rotate-overlay svg {
      width: 80px;
      height: 80px;
      animation: rotate-hint 1.6s ease-in-out infinite alternate;
    }
    @keyframes rotate-hint {
      from { transform: rotate(-90deg); }
      to   { transform: rotate(0deg); }
    }
    #rotate-overlay p {
      font-size: 1.2rem;
      margin: 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- 横向きのときに出す案内 -->
  <div id="rotate-overlay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <line x1="12" y1="18" x2="12" y2="18.01"/>
    </svg>
    <p>画面を縦にして<br>ご利用ください</p>
  </div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">WWCG</div>
    </div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");
    var overlay = document.getElementById("rotate-overlay");

    // 触る端末だけ覆う。**PC では出さない**
    // （窓が横長なのは当たり前で、そこで覆うと何もできなくなる）
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    function checkOrientation() {
      if (!isMobile) return;

      var landscape = window.innerWidth > window.innerHeight;
      overlay.classList.toggle("visible", landscape);
    }

    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", function () {
      // orientationchange の直後は innerWidth/Height が未確定なので少し待つ
      setTimeout(checkOrientation, 100);
    });
    checkOrientation();

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === "error") div.style = "background: red; padding: 10px;";
      else {
        if (type === "warning") div.style = "background: yellow; padding: 10px;";
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WWCGDP.loader.js";
    var config = {
      dataUrl: buildUrl + "/WWCGDP.data.unityweb",
      frameworkUrl: buildUrl + "/WWCGDP.framework.js.unityweb",
      codeUrl: buildUrl + "/WWCGDP.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "WWCG",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    if (isMobile) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no";
      document.getElementsByTagName("head")[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        fullscreenButton.onclick = function () {
          document.makeFullscreen('unity-container');
        };
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
